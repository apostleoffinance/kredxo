[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# Monad execution rules (Foundry v1.8+). Equivalent to --network monad.
network = "monad"
eth-rpc-url = "https://testnet-rpc.monad.xyz"
chain_id = 10143
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_mainnet = "https://rpc.monad.xyz"

[invariant]
runs = 32
depth = 16
fail_on_revert = false

[fuzz]
runs = 128

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
